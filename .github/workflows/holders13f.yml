# Big investors in the homebuilders (Builder Stocks): once a day, see whether the SEC has
# posted a new Form 13F bulk file; if so, read it and update 13f.json on the "data" branch,
# which the widget downloads. Only public SEC data is stored. SEC asks every request to
# name a contact: this uses the repo owner's GitHub no-reply address.
# A failed run, or a bulk file that's overdue, opens a "13F:" issue (closed by the next good run).
name: 13F big investors

on:
  schedule:
    - cron: "23 14 * * *" # 14:23 UTC, about 8:23am Central
  workflow_dispatch:
  push:
    branches: [staging]
    paths:
      - "tools/holders13f/**"
      - ".github/workflows/holders13f.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: holders13f
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Get the data branch (made the first time)
        run: |
          git fetch origin data:data 2>/dev/null || true
          if git show-ref --quiet refs/heads/data; then
            git worktree add databr data
          else
            git worktree add --detach databr
            cd databr && git checkout --orphan data && git rm -rfq . && cd ..
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read new SEC bulk files and rebuild 13f.json
        env:
          SEC_CONTACT: ${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com
        run: |
          set -o pipefail
          python3 -u tools/holders13f/build.py --cache databr/13f-sets --out databr/13f.json 2>&1 | tee build.log

      - name: Save to the data branch
        run: |
          cd databr
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name="13F job" -c user.email="${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com" commit -qm "13F big investors: $(date -u +%Y-%m-%d)"
          git push -q origin data

      - name: Show the summary on the run page
        if: always()
        run: cat build.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Open or close the 13F issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const tag = "<!-- holders13f -->";
            const open = (await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: "open", per_page: 100 }))
              .filter((i) => !i.pull_request && (i.body || "").includes(tag));
            let problem = null;
            const ok = "${{ job.status }}" === "success";
            if (!ok) problem = `The 13F job failed, so Builder Stocks' big-investor grid isn't updating. [Run](${run})\n\n\`\`\`\n${(fs.existsSync("build.log") ? fs.readFileSync("build.log", "utf8") : "").slice(-2500)}\n\`\`\``;
            else {
              if (!fs.existsSync("databr/13f.json")) { core.setFailed("no 13f.json"); return; }
              const j = JSON.parse(fs.readFileSync("databr/13f.json", "utf8"));
              const end = new Date(j.newestFile.window[1] + "T00:00:00Z");
              // the next file covers the 3 months after this one; allow it 45 days to appear
              const due = new Date(end.getTime() + (92 + 45) * 864e5);
              if (Date.now() > due.getTime()) problem = `The SEC hasn't posted its next 13F bulk file (after ${j.newestFile.name}), now ${Math.round((Date.now() - due.getTime()) / 864e5)} days later than expected. Builder Stocks keeps showing ${j.periods.at(-1)} holdings. [Run](${run})`;
            }
            if (problem) {
              if (open.length) await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body: problem });
              else await github.rest.issues.create({ ...context.repo, title: ok ? "13F: the SEC's next bulk file is late" : "13F: the big-investor job failed", body: `${tag}\n${problem}\n\nThis closes by itself after the next good run.` });
            } else for (const i of open) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: `Working again. [Run](${run})` });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: "closed" });
            }
